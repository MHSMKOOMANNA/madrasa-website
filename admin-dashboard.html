<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Madrasa</title>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://oqhnaxolmqxifyjyzufj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xGFE4JO5yMzYW7fIG3f1xg_1fEn300G";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    window.supabaseClient = supabase;

    async function checkAdmin() {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        window.location.href = "admin.html";
        return;
      }

      const { data: admin, error } = await supabase
        .from("admins")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();

      if (error || !admin) {
        await supabase.auth.signOut();
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("dashboard").style.display = "block";
      document.getElementById("loading").style.display = "none";
    }

    window.logout = async function () {
      await supabase.auth.signOut();
      window.location.href = "admin.html";
    };

    window.addStudent = async function () {
      const studentName =
        document.getElementById("studentName").value.trim();

      const studentClass =
        document.getElementById("studentClass").value.trim();

      const username =
        document.getElementById("loginId").value.trim();

      const password =
        document.getElementById("studentPassword").value;

      const message =
        document.getElementById("message");

      if (!studentName) {
        message.textContent = "Please enter student name.";
        message.className = "message error";
        return;
      }

      if (!studentClass) {
        message.textContent = "Please enter class.";
        message.className = "message error";
        return;
      }

      if (!username) {
        message.textContent = "Please enter login ID.";
        message.className = "message error";
        return;
      }

      // Password requirement changed to 1 character
      if (password.length < 1) {
        message.textContent = "Password must be at least 1 character.";
        message.className = "message error";
        return;
      }

      const button =
        document.getElementById("createButton");

      button.disabled = true;
      button.textContent = "CREATING...";

      message.textContent = "Creating student...";
      message.className = "message";

      try {
        const {
          data: { session },
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError || !session) {
          throw new Error("Admin session expired. Please login again.");
        }

        const { data, error } =
          await supabase.functions.invoke(
            "create-student",
            {
              body: {
                studentName: studentName,
                studentClass: studentClass,
                username: username,
                password: password
              }
            }
          );

        if (error) {
          throw new Error(error.message);
        }

        if (data && data.error) {
          throw new Error(data.error);
        }

        message.textContent =
          "Student created successfully.";

        message.className = "message success";

        document.getElementById("studentName").value = "";
        document.getElementById("studentClass").value = "";
        document.getElementById("loginId").value = "";
        document.getElementById("studentPassword").value = "";

      } catch (error) {
        console.error(error);

        message.textContent =
          "Error: " + error.message;

        message.className = "message error";

      } finally {
        button.disabled = false;
        button.textContent = "CREATE STUDENT";
      }
    };

    window.addEventListener("DOMContentLoaded", checkAdmin);
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .logout {
      background: white;
      color: #075e54;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      color: #075e54;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #075e54;
    }

    .create-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #075e54;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-btn:hover {
      background: #064e46;
    }

    .create-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
    }

    #dashboard {
      display: none;
    }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <div id="loading">
    Checking admin access...
  </div>

  <div id="dashboard">

    <div class="header">
      <h1>Admin Dashboard</h1>

      <button class="logout" onclick="logout()">
        LOGOUT
      </button>
    </div>

    <div class="container">

      <div class="card">

        <h2>Create Student Account</h2>

        <label for="studentName">
          Student Name
        </label>

        <input
          type="text"
          id="studentName"
          placeholder="Enter student name"
        >

        <label for="studentClass">
          Class
        </label>

        <input
          type="text"
          id="studentClass"
          placeholder="Enter class"
        >

        <label for="loginId">
          Login ID
        </label>

        <input
          type="text"
          id="loginId"
          placeholder="Enter login ID"
        >

        <label for="studentPassword">
          Password
        </label>

        <input
          type="password"
          id="studentPassword"
          placeholder="Enter password"
        >

        <div class="note">
          Password must contain at least 1 character.
        </div>

        <button
          id="createButton"
          class="create-btn"
          onclick="addStudent()"
        >
          CREATE STUDENT
        </button>

        <div id="message"></div>

      </div>

    </div>

  </div>

</body>
</html>
