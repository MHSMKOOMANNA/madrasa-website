<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    .header {
      background: #075e45;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      color: #075e45;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .create-btn {
      background: #075e45;
      color: white;
    }

    .create-btn:hover {
      background: #064d39;
    }

    .logout-btn {
      background: #b42318;
      color: white;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #e7f6ec;
      color: #176b35;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    #dashboard {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Admin Dashboard</h1>
    <p>Madarsa Student Management</p>
  </div>

  <div class="container">

    <div id="loading" class="loading">
      Checking admin login...
    </div>

    <div id="dashboard">

      <div class="card">
        <h2>Create Student Account</h2>

        <label for="studentName">Student Name</label>
        <input
          type="text"
          id="studentName"
          placeholder="Enter student name"
        >

        <label for="studentClass">Class</label>
        <input
          type="text"
          id="studentClass"
          placeholder="Enter class"
        >

        <label for="loginId">Login ID</label>
        <input
          type="text"
          id="loginId"
          placeholder="Enter login ID"
        >

        <label for="studentPassword">Password</label>
        <input
          type="password"
          id="studentPassword"
          placeholder="Enter password"
        >

        <button
          class="create-btn"
          id="createButton"
          onclick="addStudent()"
        >
          CREATE STUDENT
        </button>

        <div id="message" class="message"></div>
      </div>

      <div class="card">
        <h2>Admin Account</h2>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          LOGOUT
        </button>
      </div>

    </div>
  </div>


  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://oqhnaxolmqxifyjyzufj.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_xGFE4JO5yMzYW7fIG3f1xg_1fEn300G";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ==============================
    // CHECK ADMIN
    // ==============================

    async function checkAdmin() {

      const loading =
        document.getElementById("loading");

      const dashboard =
        document.getElementById("dashboard");


      try {

        const {
          data: {
            session
          },
          error: sessionError
        } = await supabase.auth.getSession();


        if (sessionError || !session) {

          window.location.href =
            "admin.html";

          return;
        }


        const user =
          session.user;


        const {
          data: admin,
          error: adminError
        } = await supabase
          .from("admins")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();


        if (adminError) {

          console.error(
            "Admin check error:",
            adminError
          );

          loading.textContent =
            "Admin verification failed.";

          return;
        }


        if (!admin) {

          loading.textContent =
            "You are not authorized as an admin.";

          return;
        }


        loading.style.display =
          "none";

        dashboard.style.display =
          "block";

      }

      catch (error) {

        console.error(error);

        loading.textContent =
          "Something went wrong.";

      }

    }


    // ==============================
    // CREATE STUDENT
    // ==============================

    window.addStudent = async function () {

      const studentName =
        document
          .getElementById("studentName")
          .value
          .trim();


      const studentClass =
        document
          .getElementById("studentClass")
          .value
          .trim();


      const username =
        document
          .getElementById("loginId")
          .value
          .trim();


      const password =
        document
          .getElementById("studentPassword")
          .value;


      const message =
        document.getElementById("message");


      const createButton =
        document.getElementById("createButton");


      message.className =
        "message";

      message.textContent =
        "";


      // VALIDATION

      if (!studentName) {

        message.textContent =
          "Please enter the student name.";

        message.className =
          "message error";

        return;
      }


      if (!studentClass) {

        message.textContent =
          "Please enter the class.";

        message.className =
          "message error";

        return;
      }


      if (!username) {

        message.textContent =
          "Please enter the Login ID.";

        message.className =
          "message error";

        return;
      }


      if (password.length < 1) {

        message.textContent =
          "Please enter a password.";

        message.className =
          "message error";

        return;
      }


      // GET SESSION

      const {
        data: {
          session
        },
        error: sessionError
      } = await supabase.auth.getSession();


      if (sessionError || !session) {

        message.textContent =
          "Admin session expired. Please login again.";

        message.className =
          "message error";

        return;
      }


      createButton.disabled =
        true;

      createButton.textContent =
        "CREATING...";


      try {

        console.log(
          "Calling create-student..."
        );


        // DIRECT FETCH
        // This lets us see the real 400 response.

        const response =
          await fetch(
            SUPABASE_URL +
            "/functions/v1/create-student",
            {
              method: "POST",

              headers: {
                "Authorization":
                  "Bearer " + session.access_token,

                "apikey":
                  SUPABASE_ANON_KEY,

                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                studentName:
                  studentName,

                studentClass:
                  studentClass,

                username:
                  username,

                password:
                  password

              })
            }
          );


        // READ RESPONSE AS TEXT FIRST

        const responseText =
          await response.text();


        console.log(
          "HTTP status:",
          response.status
        );

        console.log(
          "Raw response:",
          responseText
        );


        // TRY JSON

        let responseData = null;

        try {

          responseData =
            JSON.parse(responseText);

        } catch {

          responseData = null;

        }


        // ERROR

        if (!response.ok) {

          const realError =
            responseData?.error ||
            responseData?.message ||
            responseText ||
            "Unknown error";


          console.error(
            "REAL SUPABASE ERROR:",
            realError
          );


          message.textContent =
            "ERROR: " + realError;


          message.className =
            "message error";


          return;
        }


        // SUCCESS

        message.textContent =
          responseData?.message ||
          "Student created successfully.";


        message.className =
          "message success";


        // CLEAR FORM

        document
          .getElementById("studentName")
          .value = "";

        document
          .getElementById("studentClass")
          .value = "";

        document
          .getElementById("loginId")
          .value = "";

        document
          .getElementById("studentPassword")
          .value = "";


      }

      catch (error) {

        console.error(
          "FETCH ERROR:",
          error
        );


        message.textContent =
          "ERROR: " +
          (
            error?.message ||
            "Could not connect to the Edge Function."
          );


        message.className =
          "message error";

      }

      finally {

        createButton.disabled =
          false;

        createButton.textContent =
          "CREATE STUDENT";

      }

    };


    // ==============================
    // LOGOUT
    // ==============================

    window.logout = async function () {

      await supabase.auth.signOut();

      window.location.href =
        "admin.html";

    };


    // START

    checkAdmin();

  </script>

</body>
</html>
