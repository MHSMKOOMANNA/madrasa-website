<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    .header {
      background: #075e45;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      color: #075e45;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .create-btn {
      background: #075e45;
      color: white;
    }

    .create-btn:hover {
      background: #064d39;
    }

    .logout-btn {
      background: #b42318;
      color: white;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #e7f6ec;
      color: #176b35;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    #dashboard {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Admin Dashboard</h1>
    <p>Madarsa Student Management</p>
  </div>

  <div class="container">

    <div id="loading" class="loading">
      Checking admin login...
    </div>

    <div id="dashboard">

      <div class="card">
        <h2>Create Student Account</h2>

        <label for="studentName">Student Name</label>
        <input
          type="text"
          id="studentName"
          placeholder="Enter student name"
        >

        <label for="studentClass">Class</label>
        <input
          type="text"
          id="studentClass"
          placeholder="Enter class"
        >

        <label for="loginId">Login ID</label>
        <input
          type="text"
          id="loginId"
          placeholder="Enter login ID"
        >

        <label for="studentPassword">Password</label>
        <input
          type="password"
          id="studentPassword"
          placeholder="Enter password"
        >

        <button
          class="create-btn"
          id="createButton"
          onclick="addStudent()"
        >
          CREATE STUDENT
        </button>

        <div id="message" class="message"></div>
      </div>

      <div class="card">
        <h2>Admin Account</h2>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          LOGOUT
        </button>
      </div>

    </div>

  </div>


  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://oqhnaxolmqxifyjyzufj.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_xGFE4JO5yMzYW7fIG3f1xg_1fEn300G";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // --------------------------------------------------
    // CHECK ADMIN
    // --------------------------------------------------

    async function checkAdmin() {

      const loading =
        document.getElementById("loading");

      const dashboard =
        document.getElementById("dashboard");


      try {

        const {
          data: {
            session
          },
          error: sessionError
        } = await supabase.auth.getSession();


        if (sessionError) {
          console.error(
            "Session error:",
            sessionError
          );

          window.location.href = "admin.html";
          return;
        }


        if (!session) {

          window.location.href =
            "admin.html";

          return;
        }


        const user =
          session.user;


        console.log(
          "Logged in user:",
          user.id
        );


        const {
          data: admin,
          error: adminError
        } = await supabase
          .from("admins")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();


        if (adminError) {

          console.error(
            "Admin check error:",
            adminError
          );

          loading.textContent =
            "Admin verification failed.";

          return;
        }


        if (!admin) {

          loading.textContent =
            "You are not authorized as an admin.";

          return;
        }


        loading.style.display =
          "none";

        dashboard.style.display =
          "block";

      }

      catch (error) {

        console.error(
          "Unexpected admin check error:",
          error
        );

        loading.textContent =
          "Something went wrong.";

      }

    }


    // --------------------------------------------------
    // CREATE STUDENT
    // --------------------------------------------------

    window.addStudent = async function () {

      const studentName =
        document
          .getElementById("studentName")
          .value
          .trim();


      const studentClass =
        document
          .getElementById("studentClass")
          .value
          .trim();


      const username =
        document
          .getElementById("loginId")
          .value
          .trim();


      const password =
        document
          .getElementById("studentPassword")
          .value;


      const message =
        document.getElementById("message");


      const createButton =
        document.getElementById("createButton");


      // Clear old message

      message.className =
        "message";

      message.textContent =
        "";


      // --------------------------------------------------
      // BASIC VALIDATION
      // --------------------------------------------------

      if (!studentName) {

        message.textContent =
          "Please enter the student name.";

        message.className =
          "message error";

        return;

      }


      if (!studentClass) {

        message.textContent =
          "Please enter the class.";

        message.className =
          "message error";

        return;

      }


      if (!username) {

        message.textContent =
          "Please enter the Login ID.";

        message.className =
          "message error";

        return;

      }


      if (password.length < 1) {

        message.textContent =
          "Password must be at least 1 character.";

        message.className =
          "message error";

        return;

      }


      // --------------------------------------------------
      // GET CURRENT SESSION
      // --------------------------------------------------

      const {
        data: {
          session
        },
        error: sessionError
      } = await supabase.auth.getSession();


      if (sessionError) {

        console.error(
          "Session error:",
          sessionError
        );

        message.textContent =
          "Could not get your admin session.";

        message.className =
          "message error";

        return;

      }


      if (!session) {

        message.textContent =
          "Your admin session has expired. Please login again.";

        message.className =
          "message error";

        return;

      }


      // --------------------------------------------------
      // DISABLE BUTTON
      // --------------------------------------------------

      createButton.disabled =
        true;

      createButton.textContent =
        "CREATING...";


      try {

        console.log(
          "Calling create-student function..."
        );


        const {
          data,
          error
        } = await supabase.functions.invoke(
          "create-student",
          {
            body: {
              studentName:
                studentName,

              studentClass:
                studentClass,

              username:
                username,

              password:
                password
            }
          }
        );


        // --------------------------------------------------
        // IMPORTANT DEBUG INFORMATION
        // --------------------------------------------------

        console.log(
          "Function returned data:",
          data
        );

        console.log(
          "Function returned error:",
          error
        );


        // --------------------------------------------------
        // SHOW REAL ERROR
        // --------------------------------------------------

        if (error) {

          console.error(
            "Function error:",
            error
          );


          console.error(
            "Function response data:",
            data
          );


          let realError =
            data?.error ||
            data?.message ||
            error.message ||
            "Unknown error";


          message.textContent =
            "ERROR: " + realError;


          message.className =
            "message error";


          return;

        }


        // --------------------------------------------------
        // CHECK FUNCTION RESPONSE
        // --------------------------------------------------

        if (data?.error) {

          console.error(
            "Server error:",
            data.error
          );


          message.textContent =
            "ERROR: " + data.error;


          message.className =
            "message error";


          return;

        }


        // --------------------------------------------------
        // SUCCESS
        // --------------------------------------------------

        message.textContent =
          "Student created successfully.";

        message.className =
          "message success";


        // Clear form

        document
          .getElementById("studentName")
          .value = "";

        document
          .getElementById("studentClass")
          .value = "";

        document
          .getElementById("loginId")
          .value = "";

        document
          .getElementById("studentPassword")
          .value = "";


      }

      catch (error) {

        console.error(
          "Unexpected error:",
          error
        );


        message.textContent =
          "ERROR: " +
          (
            error?.message ||
            "Unexpected error occurred."
          );


        message.className =
          "message error";

      }

      finally {

        createButton.disabled =
          false;

        createButton.textContent =
          "CREATE STUDENT";

      }

    };


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    window.logout = async function () {

      await supabase.auth.signOut();

      window.location.href =
        "admin.html";

    };


    // --------------------------------------------------
    // START
    // --------------------------------------------------

    checkAdmin();

  </script>

</body>
</html>
