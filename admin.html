<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MAADANUDHEEN MADRASA</title>
  <meta name="description" content="Admin login portal for Maadanudheen Madrasa teachers.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #064d35;
      --primary-light: #075e45;
      --accent: #10b981;
      --bg: #0a1628;
      --surface: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.12);
      --text: #f0f4f8;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(6,77,53,0.4) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 75%, rgba(16,185,129,0.1) 0%, transparent 55%);
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* ── TAB SWITCHER ── */
    .tab-switcher {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-light);
      color: white;
      box-shadow: 0 2px 10px rgba(6,77,53,0.4);
    }

    /* ── LOGIN BOX ── */
    .login-box {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-wrap img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: white;
      padding: 5px;
      object-fit: contain;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.4), 0 8px 24px rgba(0,0,0,0.3);
    }

    .logo-wrap h1 {
      font-size: 17px;
      font-weight: 800;
      color: white;
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .logo-wrap p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── PANEL ── */
    .panel { display: none; }
    .panel.active { display: block; }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── INPUTS ── */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: rgba(16,185,129,0.5);
      background: rgba(255,255,255,0.09);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }

    .form-group input::placeholder { color: rgba(255,255,255,0.25); }

    /* ── BUTTONS ── */
    .primary-btn {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.5px;
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    }

    .primary-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ── MESSAGE ── */
    #loginMessage, #resetMessage {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .msg-success {
      display: block !important;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: var(--accent);
    }

    .msg-error {
      display: block !important;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    /* ── TEACHER ACCOUNTS TABLE ── */


    /* ── RESET INFO ── */
    .reset-info {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .reset-info strong { color: var(--text); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- TAB SWITCHER -->
  <div class="tab-switcher">
    <button class="tab-btn active" id="tabLogin" onclick="showPanel('login')">🔐 Admin Login</button>
    <button class="tab-btn" id="tabReset" onclick="showPanel('reset')">🔑 Forgot Password</button>
  </div>

  <div class="login-box">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Madrasa Logo">
      <h1>MAADANUDHEEN MADRASA</h1>
      <p>Teacher / Admin Portal</p>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div class="panel active" id="panelLogin">
      <div class="panel-title">🔐 Admin Sign In</div>

      <div class="form-group">
        <label>Login ID</label>
        <input type="text" id="email" placeholder="Enter your Login ID" autocomplete="username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') loginAdmin()">
      </div>

      <button class="primary-btn" id="loginBtn" onclick="loginAdmin()">LOGIN →</button>

      <div id="loginMessage"></div>


    </div>

    <!-- ── FORGOT PASSWORD PANEL ── -->
    <div class="panel" id="panelReset">
      <div class="panel-title">🔑 Reset Password</div>

      <div class="reset-info">
        Enter your admin email address and we'll send you a <strong>password reset link</strong>.<br>
        Check your inbox and click the link to set a new password.
      </div>

      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="resetEmail" placeholder="LOGINID@admin.madrasa.example"
          onkeydown="if(event.key==='Enter') sendReset()">
      </div>

      <button class="primary-btn" id="resetBtn" onclick="sendReset()">📧 Send Reset Link</button>

      <div id="resetMessage"></div>

      <div class="back-link" onclick="showPanel('login')">← Back to Login</div>
    </div>

  </div>
</div>


<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://oqhnaxolmqxifyjyzufj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_xGFE4JO5yMzYW7fIG3f1xg_1fEn300G";
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── Panel switching ──
  window.showPanel = function(panel) {
    document.getElementById("panelLogin").classList.toggle("active", panel === "login");
    document.getElementById("panelReset").classList.toggle("active", panel === "reset");
    document.getElementById("tabLogin").classList.toggle("active", panel === "login");
    document.getElementById("tabReset").classList.toggle("active", panel === "reset");
  };

  // ── Login ──
  // Maps plain Login IDs to their registered Supabase email addresses
  const TEACHER_EMAILS = {
    "MINHAJP":  "minhajmmp85@gmail.com",
    "DARIMI":   "darimi@admin.madrasa.example",
    "YEMANI":   "yemani@admin.madrasa.example",
    "SHAHIN":   "shahin@admin.madrasa.example",
    "SWALIH":   "swalih@admin.madrasa.example",
    "BASHEER":  "basheer@admin.madrasa.example"
  };

  window.loginAdmin = async function() {
    const rawInput = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgEl = document.getElementById("loginMessage");
    const btn = document.getElementById("loginBtn");

    if (!rawInput || !password) {
      showMsg(msgEl, "⚠️ Please enter your Login ID and password.", "error");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    showMsg(msgEl, "Authenticating...", "");

    // Build list of emails to try
    const upperInput = rawInput.toUpperCase();
    const lowerInput = rawInput.toLowerCase();
    const emailsToTry = [];

    if (rawInput.includes("@")) {
      emailsToTry.push(rawInput);
    } else {
      // Check known teacher map first
      if (TEACHER_EMAILS[upperInput]) {
        emailsToTry.push(TEACHER_EMAILS[upperInput]);
      }
      // Also try common formats
      emailsToTry.push(lowerInput + "@admin.madrasa.example");
      emailsToTry.push(upperInput + "@admin.madrasa.example");
      emailsToTry.push(lowerInput + "@student.madrasa.example");
    }

    let success = false;
    let lastError = null;

    for (const email of emailsToTry) {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (!error) { success = true; break; }
      lastError = error;
    }

    if (!success) {
      showMsg(msgEl, "❌ Login failed. Please check your Login ID and password.", "error");
      btn.disabled = false;
      btn.innerHTML = "LOGIN →";
      return;
    }

    showMsg(msgEl, "✅ Login successful! Redirecting...", "success");
    setTimeout(() => { window.location.href = "admin-dashboard.html"; }, 900);
  };

  // ── Forgot Password / Reset ──
  window.sendReset = async function() {
    const emailInput = document.getElementById("resetEmail").value.trim();
    const msgEl = document.getElementById("resetMessage");
    const btn = document.getElementById("resetBtn");

    if (!emailInput) {
      showMsg(msgEl, "⚠️ Please enter your admin email.", "error");
      return;
    }

    const email = emailInput.includes("@")
      ? emailInput
      : emailInput.toUpperCase() + "@admin.madrasa.example";

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending...';

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/admin.html"
    });

    if (error) {
      showMsg(msgEl, "❌ Error: " + error.message, "error");
    } else {
      showMsg(msgEl,
        "✅ Reset link sent! Check your email inbox and click the link to set a new password.",
        "success"
      );
      document.getElementById("resetEmail").value = "";
    }

    btn.disabled = false;
    btn.innerHTML = "📧 Send Reset Link";
  };

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = type === "success" ? "msg-success" : type === "error" ? "msg-error" : "";
    el.style.display = text ? "block" : "none";
  }
</script>

</body>
</html>
