<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Panel - Maadanudheen Madrasa</title>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://oqhnaxolmqxifyjyzufj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_xGFE4JO5yMzYW7fIG3f1xg_1fEn300G";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    async function loadStudent() {

      const message =
        document.getElementById("message");

      try {

        const {
          data: { session },
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError || !session || !session.user) {
          window.location.href = "login.html";
          return;
        }

        const user = session.user;


        const username =
          user.email.split("@")[0];


        console.log(
          "Logged in email:",
          user.email
        );

        console.log(
          "User ID:",
          user.id
        );

        console.log(
          "User role:",
          user.role
        );


        const {
          data,
          error
        } = await supabase
          .from("students")
          .select("student_name, class")
          .eq("username", username)
          .maybeSingle();


        if (error) {

          console.error(
            "Database error:",
            error
          );

          message.textContent =
            "Database error: " +
            error.message;

          return;
        }


        if (!data) {

          message.textContent =
            "Student not found. Username searched: " +
            username;

          return;
        }


        document.getElementById(
          "studentName"
        ).textContent =
          data.student_name;


        document.getElementById(
          "studentName2"
        ).textContent =
          data.student_name;


        document.getElementById(
          "studentClass"
        ).textContent =
          data.class;


        message.textContent = "";


        // Load today's saved Namaz
        await loadTodayNamaz(user.id);

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error: " + error.message;
      }
    }



    async function loadTodayNamaz(userId) {

      const today =
        new Date()
          .toISOString()
          .split("T")[0];


      const {
        data,
        error
      } = await supabase
        .from("namaz")
        .select(
          "fajr, dhuhr, asr, maghrib, isha"
        )
        .eq("user_id", userId)
        .eq("date", today)
        .maybeSingle();


      if (error) {

        console.error(
          "Namaz loading error:",
          error
        );

        return;
      }


      if (!data) {

        console.log(
          "No Namaz record for today yet."
        );

        return;
      }


      document.getElementById(
        "fajr"
      ).checked = data.fajr;


      document.getElementById(
        "dhuhr"
      ).checked = data.dhuhr;


      document.getElementById(
        "asr"
      ).checked = data.asr;


      document.getElementById(
        "maghrib"
      ).checked = data.maghrib;


      document.getElementById(
        "isha"
      ).checked = data.isha;


      console.log(
        "Today's Namaz loaded:",
        data
      );
    }



    async function saveNamaz() {

      const message =
        document.getElementById("message");


      try {

        const {
          data: { user },
          error: userError
        } = await supabase.auth.getUser();


        if (userError || !user) {

          message.textContent =
            "Please login again.";

          return;
        }


        const username =
          user.email.split("@")[0];


        const today =
          new Date()
            .toISOString()
            .split("T")[0];


        const namazData = {

          user_id: user.id,

          username: username,

          date: today,

          fajr:
            document.getElementById(
              "fajr"
            ).checked,

          dhuhr:
            document.getElementById(
              "dhuhr"
            ).checked,

          asr:
            document.getElementById(
              "asr"
            ).checked,

          maghrib:
            document.getElementById(
              "maghrib"
            ).checked,

          isha:
            document.getElementById(
              "isha"
            ).checked
        };


        console.log(
          "Saving Namaz:",
          namazData
        );


        const {
          data,
          error
        } = await supabase
          .from("namaz")
          .upsert(
            namazData,
            {
              onConflict:
                "username,date"
            }
          )
          .select();


        if (error) {

          console.error(
            "Namaz save error:",
            error
          );

          message.style.color =
            "#a33";

          message.textContent =
            "Could not save Namaz: " +
            error.message;

          return;
        }


        console.log(
          "Namaz saved:",
          data
        );


        message.style.color =
          "green";

        message.textContent =
          "Namaz saved successfully! ✅";


      } catch (error) {

        console.error(error);

        message.style.color =
          "#a33";

        message.textContent =
          "Error: " +
          error.message;
      }
    }



    async function logout() {

      await supabase.auth.signOut();

      window.location.href =
        "login.html";
    }


    window.logout = logout;

    window.saveNamaz =
      saveNamaz;


    loadStudent();

  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #123d2b;
    }


    header {
      background: #064d35;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }


    header img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 5px;
    }


    header h1 {
      margin: 10px 0 5px;
      font-size: 25px;
    }


    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }


    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
    }


    .student-info {
      text-align: center;
    }


    .student-info h2 {
      color: #064d35;
    }


    .info-row {
      font-size: 18px;
      margin: 12px;
    }


    .label {
      font-weight: bold;
    }


    .namaz-list label {
      display: block;
      padding: 12px;
      margin: 8px 0;
      background: #f1f7f3;
      border-radius: 10px;
    }


    .namaz-list input {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      vertical-align: middle;
    }


    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }


    button {
      background: #064d35;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 12px;
    }


    .logout {
      background: #a33;
    }


    #message {
      text-align: center;
      color: #a33;
      font-weight: bold;
      margin: 15px 0;
    }


    footer {
      text-align: center;
      padding: 25px;
      background: #064d35;
      color: white;
      margin-top: 40px;
    }

  </style>

</head>


<body>


<header>

  <img
    src="logo.png"
    alt="Madrasa Logo"
  >

  <h1>
    MAADANUDHEEN MADRASA
  </h1>

  <p>
    Student Panel
  </p>

</header>



<div class="container">


  <div id="message"></div>


  <div class="card student-info">

    <h2>
      👋 Welcome,
      <span id="studentName">
        Loading...
      </span>
    </h2>


    <div class="info-row">

      <span class="label">
        Name:
      </span>

      <span id="studentName2">
        Loading...
      </span>

    </div>


    <div class="info-row">

      <span class="label">
        Class:
      </span>

      <span id="studentClass">
        Loading...
      </span>

    </div>

  </div>



  <div class="card">

    <h2>
      🕌 Today's Namaz
    </h2>


    <div class="namaz-list">


      <label>
        <input
          type="checkbox"
          id="fajr"
        >
        Fajr
      </label>


      <label>
        <input
          type="checkbox"
          id="dhuhr"
        >
        Dhuhr
      </label>


      <label>
        <input
          type="checkbox"
          id="asr"
        >
        Asr
      </label>


      <label>
        <input
          type="checkbox"
          id="maghrib"
        >
        Maghrib
      </label>


      <label>
        <input
          type="checkbox"
          id="isha"
        >
        Isha
      </label>


    </div>


    <button
      onclick="saveNamaz()"
    >
      Save Namaz
    </button>

  </div>



  <div class="card">

    <h2>
      💡 Suggestions
    </h2>


    <textarea
      placeholder="Write your suggestion here..."
    ></textarea>


    <button
      onclick="alert('Suggestions will be connected next.')"
    >
      Submit Suggestion
    </button>

  </div>



  <div
    class="card"
    style="text-align:center;"
  >

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


</div>



<footer>

  MAADANUDHEEN MADRASA

  <br>

  KOOMANNA CHENAKKAL

</footer>


</body>
</html>
